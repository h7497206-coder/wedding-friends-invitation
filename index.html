
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walima Invitation | Abu-Bakr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="invitation-page">

    
    <div class="flower-intro outer-reveal" id="flower-intro">
      <img
        src="assets/images/walima-flower.webp"
        alt="Ivory flower with navy blue and gold leaves"
      >
      <div class="flower-divider"></div>
    </div>


    <header class="page-heading">
      <h1 id="typing-heading"></h1>
      <p class="outer-reveal" id="top-subtitle">
        A SPECIAL DAY, A JOYFUL CELEBRATION
      </p>
    </header>

    <section class="invitation-card outer-reveal" id="walima-card">
      <img
        class="frame-image"
        src="assets/images/walima-frame.webp"
        alt="Decorative navy blue and gold floral invitation frame"
      >

      <div class="card-details">
        <p class="card-eyebrow">WITH GREAT PLEASURE</p>
        <h2>WALIMA INVITATION</h2>
        <div class="gold-divider"></div>

        <p class="card-intro">You are cordially invited to celebrate</p>
        <h3>Abu-Bakr <span>&amp; Mrs.</span></h3>

        <div class="gold-divider"></div>

        <p class="detail-label">DATE</p>
        <p class="detail-value">Sunday, 29 November 2026</p>

        <p class="detail-label">TIME</p>
        <p class="detail-value">1:00 PM</p>

        <p class="detail-label">VENUE</p>
        <p class="detail-value">PJ Marquee Near View Hotel</p>

        <a
          class="venue-button"
          href="https://www.google.com/maps/search/?api=1&query=PJ+Marquee+Near+View+Hotel"
          target="_blank"
          rel="noopener noreferrer"
        >
          VIEW LOCATION
        </a>
      </div>
    </section>

    <footer class="page-footer outer-reveal" id="bottom-message">
      YOUR PRESENCE WILL MAKE OUR DAY MORE MEMORABLE
    </footer>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const heading = document.getElementById("typing-heading");
      const flower = document.getElementById("flower-intro");
      const subtitle = document.getElementById("top-subtitle");
      const card = document.getElementById("walima-card");
      const footer = document.getElementById("bottom-message");

      const text = "YOU'RE CORDIALLY INVITED";
      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function reveal(element) {
        element.classList.add("is-visible");
      }

      if (reduceMotion) {
        heading.textContent = text;
        reveal(flower);
        reveal(subtitle);
        reveal(card);
        reveal(footer);
        return;
      }

      let index = 0;

      function typeHeading() {
        if (index < text.length) {
          heading.textContent += text.charAt(index);
          index++;
          setTimeout(typeHeading, 75);
        } else {
            reveal(subtitle);

          setTimeout(() => {
            reveal(card);

            setTimeout(() => {
              reveal(footer);
            }, 1000);
          }, 350);
        }
      }

      
      reveal(flower);

      setTimeout(() => {
        typeHeading();
      }, 900);

    });
  </script>
</body>
</html>
