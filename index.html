
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walima Invitation | Abu-Bakr</title>
  <link rel="stylesheet" href="cover.css">
</head>
<body>
  <main class="cover-page">

    <header class="cover-heading">
      <h1><span id="typing-heading"></span><span class="typing-cursor" aria-hidden="true">|</span></h1>
      <p id="cover-subtitle" class="reveal-hidden">
        A CELEBRATION OF A NEW BEGINNING
      </p>
    </header>

    <div class="custom-card reveal-hidden" id="invitation-card">
      <img
        src="assets/images/walima-card.webp"
        alt="Walima invitation card"
      >
    </div>

    <a
      class="cover-open reveal-hidden"
      id="open-button"
      href="invitation.html"
    >
      OPEN INVITATION <span aria-hidden="true">›</span>
    </a>

    <footer class="cover-footer reveal-hidden" id="cover-footer">
      EXCLUSIVELY FOR OUR FRIENDS
    </footer>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const heading = document.getElementById("typing-heading");
      const subtitle = document.getElementById("cover-subtitle");
      const card = document.getElementById("invitation-card");
      const button = document.getElementById("open-button");
      const footer = document.getElementById("cover-footer");

      const headingText = "YOU'RE CORDIALLY INVITED";
      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      const reveal = (element) => {
        element.classList.remove("reveal-hidden");
        element.classList.add("reveal-visible");
      };

      if (reduceMotion) {
        heading.textContent = headingText;
        document.querySelector(".typing-cursor").hidden = true;
        [subtitle, card, button, footer].forEach(reveal);
        return;
      }

      let index = 0;

      function typeHeading() {
        if (index < headingText.length) {
          heading.textContent += headingText.charAt(index);
          index++;
          setTimeout(typeHeading, 75);
        } else {
          document.querySelector(".typing-cursor").classList.add("cursor-done");

          reveal(subtitle);

          setTimeout(() => {
            reveal(card);

            setTimeout(() => {
              reveal(button);

              setTimeout(() => {
                reveal(footer);
              }, 250);
            }, 700);
          }, 300);
        }
      }

      typeHeading();
    });
  </script>
</body>
</html>
